<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Hanling Wang</title>
    <link rel="icon" href="assets/img/tuxdo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="page-intro welcome">
      <span class="eyebrow">404</span>
      <h2 class="welcome-title">Page not found</h2>
      <p class="welcome-bio"><a id="home-link" href="./">Back to homepage</a></p>
    </main>
    <script>
      (function () {
        var path = window.location.pathname;
        var marker = "/Scabbards1500/";
        var idx = path.indexOf(marker);
        var home = idx >= 0 ? path.slice(0, idx + marker.length) : "./";
        document.getElementById("home-link").setAttribute("href", home);
      })();
    </script>
  </body>
</html>
